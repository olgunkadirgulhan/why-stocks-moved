name: comments
# Yeni videolara videoya özel ilk yorum + yorumlara kişisel cevap (tools/auto_reply.py), saatte bir
on:
  schedule:
    - cron: "53 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comments
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth requests
      - name: Why Stocks Moved
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CHANNEL_NAME: "Then vs Now"
          CHANNEL_ABOUT: "Real U.S. prices then vs now (eggs, gas, groceries) from official BLS data, with inflation and minimum-wage comparisons. Ask viewers what they remember paying; never give financial advice."
          CHANNEL_KIND: general
          CHANNEL_LANG: en
          STATE_FILE: comment_replies.json
          MAX_REPLIES_PER_DAY: "45"
          REQUESTS_FILE: viewer_requests.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRST_QUESTIONS: "[\"Did you expect this move? 🤔\", \"Which stock should we explain next? 📈\", \"Did you learn something new? 💡\", \"What should we explain next? 👇\", \"Did this surprise you? 😮\"]"
        run: python tools/auto_reply.py
      - run: |
          git config user.name "comment-bot"
          git config user.email "bot@users.noreply.github.com"
          git add comment_replies*.json viewer_requests*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "comments: $(date -u +%F-%H%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
