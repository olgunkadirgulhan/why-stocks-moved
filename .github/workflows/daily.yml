name: Daily viral short

on:
  schedule:
    # 09:00 UTC = 05:00 New York, after the 07:00 UTC quota reset. GitHub sometimes delays or drops a
    # scheduled run, so backup triggers follow; the guard step skips them once today's videos exist.
    # Off the :00 mark, where GitHub drops the most runs (09:00/12:00 never fired).
    - cron: "13 8-16/2 * * *"
  workflow_dispatch:
    inputs:
      videos:
        description: How many videos (slots)
        type: choice
        default: "1"
        options: ["1", "2", "3", "4", "5", "6"]
      dry_run:
        description: Render but do not upload
        type: boolean
        default: true
      fallback_only:
        description: Only the safe market-recap format (no LLM)
        type: boolean
        default: false
      slots:
        description: "Optional one-off slots, e.g. 12:30=SHARE,17:30=SAVE (New York time)"
        default: ""
      auto:
        description: External scheduler call - behave exactly like a scheduled run (other inputs ignored)
        type: boolean
        default: false

concurrency:
  group: viral-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CONTENT_LANG: ${{ vars.CONTENT_LANG || 'en' }}
      LLM_BACKEND: gemini,groq,anthropic
      LLM_CREATIVE_BACKEND: gemini,groq,anthropic
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'unlisted' }}
      PUBLISH_TZ: ${{ vars.PUBLISH_TZ || 'America/New_York' }}
      SLOTS: ${{ (!inputs.auto && inputs.slots) || vars.SLOTS || '07:00=SAVE,09:30=SHARE,12:30=SHARE,15:00=FOLLOW,17:30=SAVE,20:00=SHARE' }}
      # schedule, or an external scheduler call with auto=true: both follow the daily plan
      SCHEDULED: ${{ github.event_name == 'schedule' || inputs.auto }}
      MARKET_TICKERS: ${{ vars.MARKET_TICKERS || '^GSPC,^IXIC,^DJI,GC=F,CL=F,DX-Y.NYB,NVDA,AAPL,MSFT,TSLA,AMZN,META' }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AndrewMultilingualNeural' }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Already produced today?
        id: guard
        run: |
          # a backup trigger must not produce a second batch; look at the latest main, not the trigger commit
          git fetch -q origin main
          done_today=$(git ls-tree --name-only origin/main data/ | grep -E "data/(job|recap)_$(date -u +%F)" || true)
          if [ "$SCHEDULED" = "true" ] && [ -n "$done_today" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "today's videos already exist, nothing to do"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (ffmpeg, fonts)
        if: steps.guard.outputs.skip != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Cache Piper voice (offline backup TTS)
        if: steps.guard.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper-voices
          key: piper-voices-v1

      - name: Skill repos + Python deps (always latest yt-dlp / skills)
        if: steps.guard.outputs.skip != '1'
        run: |
          git clone --depth 1 https://github.com/Jakeschincariol/youtube-agent-skill.git vendor/youtube-agent-skill
          git clone --depth 1 https://github.com/Ootto-AI/claude-content-skills.git vendor/claude-content-skills
          pip install --disable-pip-version-check -U -r requirements.txt

      - name: Produce and publish
        if: steps.guard.outputs.skip != '1'
        run: |
          ARGS="--videos ${{ (github.event_name == 'schedule' || inputs.auto) && (vars.VIDEOS_PER_DAY || '3') || inputs.videos }}"
          if [ "$SCHEDULED" != "true" ] && [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # Until the YouTube API audit is approved, API uploads get locked private forever.
          # Scheduled runs only render (videos come as artifacts) until PUBLISH_MODE=live is set.
          if [ "$SCHEDULED" = "true" ] && [ "${{ vars.PUBLISH_MODE }}" != "live" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$SCHEDULED" != "true" ] && [ "${{ inputs.fallback_only }}" = "true" ]; then ARGS="$ARGS --fallback-only"; fi
          python daily_viral.py $ARGS

      - name: Videos as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.json
            logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Günün videosu (Telegram relay için)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-${{ github.run_id }}
          path: social/
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit state (brain, outliers, jobs)
        if: always()
        run: |
          git config user.name "viral-bot"
          git config user.email "viral-bot@users.noreply.github.com"
          # whole folders: an unmatched glob would make git add nothing at all (.gitignore filters the rest)
          git add -A state data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "state: $(date -u +%F) daily run"
          git pull --rebase --autostash && git push
