name: morexp
# Which Cost More Shorts (2026-11-08; Then vs Now yeni konsept, morexp.py, BLS fiyatları). CONTENT_MODE=morexp iken daily.yml kapalı.
on:
  schedule:
    - cron: "33 13-22 * * *"
  workflow_dispatch:
    inputs:
      auto:
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: morexp
  cancel-in-progress: false
jobs:
  make:
    if: (github.event_name != 'schedule' && !inputs.auto) || vars.CONTENT_MODE == 'morexp'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -q Pillow numpy requests google-api-python-client google-auth
      - env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PER_DAY: ${{ vars.MX_PER_DAY || '3' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "true" ]; then python morexp.py --auto; else python morexp.py --dry-run; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morexp-${{ github.run_id }}
          path: out/morexp/*.mp4
          retention-days: 7
      - name: Kaydı sakla
        if: always()
        run: |
          git config user.name "morexp-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/tvn/morexp_published.csv 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "morexp: kayıt $(date -u +%F-%H%M)"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep $((i*15)); done
